<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PLAN.json Preview</title>
    <style>
        :root {
            --bg-color: #1e1e1e;
            --text-color: #d4d4d4;
            --heading-color: #569cd6;
            --link-color: #4ec9b0;
            --code-bg: #2d2d2d;
            --border-color: #404040;
            --success-color: #4caf50;
            --warning-color: #ff9800;
            --info-color: #2196f3;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 20px;
            line-height: 1.6;
        }

        .status-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            padding: 10px;
            background-color: var(--code-bg);
            border-radius: 6px;
            font-size: 12px;
        }

        .badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: 500;
        }

        .badge-completed {
            background-color: var(--success-color);
            color: white;
        }

        .badge-in-progress {
            background-color: var(--warning-color);
            color: black;
        }

        .badge-not-started {
            background-color: var(--border-color);
            color: white;
        }

        .markdown-content {
            font-family: 'Consolas', 'Monaco', monospace;
        }

        h1,
        h2,
        h3,
        h4,
        h5,
        h6 {
            color: var(--heading-color);
            margin-top: 1.5em;
            margin-bottom: 0.5em;
        }

        code {
            background-color: var(--code-bg);
            padding: 2px 6px;
            border-radius: 3px;
        }

        hr {
            border: none;
            border-top: 1px solid var(--border-color);
            margin: 20px 0;
        }

        ul {
            padding-left: 20px;
        }

        li {
            margin: 4px 0;
        }

        input[type="checkbox"] {
            margin-right: 6px;
            transform: scale(1.2);
            accent-color: var(--success-color);
        }

        input[type="checkbox"].in-progress {
            accent-color: var(--warning-color);
        }
    </style>
</head>

<body>
    <div class="status-bar">{{STATUS_BADGE}}</div>
    <div class="markdown-content">{{CONTENT}}</div>
</body>

</html>
